name: Build, Test & Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ── Build Windows installer ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build server .exe
        run: pyinstaller build/claude-gallery-server.spec --distpath build/windows/dist

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: build/windows/installer.iss
          options: /O+

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/dist/ClaudeGallery-Setup.exe


  # ── Build macOS pkg ─────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .pkg
        run: bash build/mac/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: build/mac/dist/ClaudeGallery-*.pkg


  # ── Smoke test Windows ──────────────────────────────────────────────
  test-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Install silently
        timeout-minutes: 5
        shell: powershell
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          Write-Host "Installing $($exe.FullName)"
          Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Write-Host "Install complete"

      - name: Start server
        timeout-minutes: 2
        shell: powershell
        run: |
          $server = "$env:LOCALAPPDATA\ClaudeGallery\claude-gallery-server.exe"
          if (Test-Path $server) {
            Write-Host "Found server at $server"
            Start-Process -FilePath $server -WindowStyle Hidden
          } else {
            Write-Host "Server binary not found. Contents of LOCALAPPDATA\ClaudeGallery:"
            Get-ChildItem "$env:LOCALAPPDATA\ClaudeGallery" -Recurse -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Run smoke tests
        timeout-minutes: 5
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\smoke.ps1 -StartupTimeout 30

      - name: Cleanup
        if: always()
        shell: powershell
        run: taskkill /F /IM claude-gallery-server.exe 2>$null; exit 0


  # ── Smoke test macOS ────────────────────────────────────────────────
  test-mac:
    needs: build-mac
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist

      - name: Install pkg
        timeout-minutes: 5
        run: |
          pkg=$(ls dist/*.pkg | head -1)
          echo "Installing $pkg"
          sudo installer -pkg "$pkg" -target /

      - name: Set up user home directory
        # The postinstall script runs as root — create user dirs and copy
        # gallery.html with correct ownership for the runner user
        run: |
          sudo mkdir -p "$HOME/ClaudeGallery/artifacts"
          sudo cp /Library/ClaudeGallery/gallery.html "$HOME/ClaudeGallery/gallery.html"
          sudo chown -R "$USER" "$HOME/ClaudeGallery"

      - name: Load launchd agent
        run: |
          # macOS 13+ requires launchctl bootstrap instead of the deprecated load
          PLIST="$HOME/Library/LaunchAgents/com.claude-gallery.server.plist"
          launchctl bootstrap "gui/$(id -u)" "$PLIST" 2>/dev/null || \
          launchctl load -w "$PLIST" 2>/dev/null || true
          # Give server a moment to start
          sleep 3

      - name: Run smoke tests
        timeout-minutes: 5
        run: bash tests/smoke.sh

      - name: Cleanup
        if: always()
        run: |
          PLIST="$HOME/Library/LaunchAgents/com.claude-gallery.server.plist"
          launchctl bootout "gui/$(id -u)" "$PLIST" 2>/dev/null || \
          launchctl unload -w "$PLIST" 2>/dev/null || true


  # ── Publish release (only if both tests pass) ───────────────────────
  release:
    needs: [test-windows, test-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-installer/ClaudeGallery-Setup.exe
            mac-installer/ClaudeGallery-*.pkg
          generate_release_notes: true
