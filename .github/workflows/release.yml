name: Build, Test & Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ── Build Windows installer ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build server .exe
        run: pyinstaller build/claude-gallery-server.spec --distpath build/windows/dist
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: build/windows/installer.iss
          options: /O+
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/dist/ClaudeGallery-Setup.exe


  # ── Build macOS pkg ─────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build .pkg
        run: bash build/mac/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: build/mac/dist/ClaudeGallery-*.pkg


  # ── Smoke test Windows ──────────────────────────────────────────────
  test-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Disable Windows Defender real-time scanning
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install silently
        timeout-minutes: 3
        shell: powershell
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          Write-Host "Installing: $($exe.FullName)"
          Start-Process -FilePath $exe.FullName `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=" `
            -Wait
          Write-Host "Install complete"
          Get-ChildItem "$env:LOCALAPPDATA\ClaudeGallery" -ErrorAction SilentlyContinue

      - name: Inject CLAUDE.md manually
        # Run the inject script directly so we control the timeout
        timeout-minutes: 2
        shell: powershell
        run: |
          $script = "$env:LOCALAPPDATA\ClaudeGallery\inject-claude.ps1"
          if (Test-Path $script) {
            Write-Host "Running inject-claude.ps1"
            & powershell -ExecutionPolicy Bypass -File $script
            Write-Host "Done"
          } else {
            Write-Host "inject-claude.ps1 not found - skipping"
          }

      - name: Start server
        timeout-minutes: 2
        shell: powershell
        run: |
          $server = "$env:LOCALAPPDATA\ClaudeGallery\claude-gallery-server.exe"
          if (-not (Test-Path $server)) { Write-Host "Server binary not found"; exit 1 }
          # Pre-create the data dirs so the binary has somewhere to write
          $docs = [Environment]::GetFolderPath('MyDocuments')
          New-Item -ItemType Directory -Force -Path "$docs\ClaudeGallery\artifacts" | Out-Null
          Copy-Item "$env:LOCALAPPDATA\ClaudeGallery\gallery.html" "$docs\ClaudeGallery\gallery.html" -Force -ErrorAction SilentlyContinue
          # console=True binary: redirect stdout+stderr to a log file for diagnostics
          $log = "$env:TEMP\claude-gallery-server.log"
          Start-Process -FilePath $server -RedirectStandardOutput $log -RedirectStandardError "$env:TEMP\claude-gallery-server-err.log" -NoNewWindow
          Start-Sleep -Seconds 5
          Write-Host "=== Server stdout ==="
          Get-Content $log -ErrorAction SilentlyContinue
          Write-Host "=== Server stderr ==="
          Get-Content "$env:TEMP\claude-gallery-server-err.log" -ErrorAction SilentlyContinue
          Write-Host "=== Port check ==="
          netstat -ano | Select-String "7477"

      - name: Run smoke tests
        timeout-minutes: 5
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\smoke.ps1 -StartupTimeout 30

      - name: Cleanup
        if: always()
        shell: powershell
        run: taskkill /F /IM claude-gallery-server.exe 2>&1 | Out-Null; exit 0


  # ── Smoke test macOS ────────────────────────────────────────────────
  test-mac:
    needs: build-mac
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist

      - name: Install pkg with log
        timeout-minutes: 5
        run: |
          pkg=$(ls dist/*.pkg | head -1)
          echo "=== Installing: $pkg ==="
          sudo installer -pkg "$pkg" -target / -verbose
          echo "=== /usr/local/bin contents: ==="
          ls -la /usr/local/bin/claude* 2>/dev/null || echo "no claude binary found"
          echo "=== /Library/ClaudeGallery contents: ==="
          ls -la /Library/ClaudeGallery/ 2>/dev/null || echo "/Library/ClaudeGallery not found"
          echo "=== LaunchAgents: ==="
          ls -la ~/Library/LaunchAgents/com.claude* 2>/dev/null || echo "no plist found"

      - name: Set up user home directory
        run: |
          sudo mkdir -p "$HOME/ClaudeGallery/artifacts"
          sudo cp /Library/ClaudeGallery/gallery.html "$HOME/ClaudeGallery/gallery.html"
          sudo chown -R "$USER" "$HOME/ClaudeGallery"
          mkdir -p "$HOME/.claude"
          CLAUDE_MD="$HOME/.claude/CLAUDE.md"
          if ! grep -q "claude-gallery-start" "$CLAUDE_MD" 2>/dev/null; then
            printf '\n<!-- claude-gallery-start -->\n# Claude Gallery\nA local artifact viewer is running at http://localhost:7477.\n<!-- claude-gallery-end -->\n' >> "$CLAUDE_MD"
          fi

      - name: Start server
        timeout-minutes: 2
        run: |
          # Double-fork via Python so the server is fully reparented to PID 1
          # and survives when this step's shell exits.
          printf 'import os, subprocess\npid = os.fork()\nif pid == 0:\n    os.setsid()\n    pid2 = os.fork()\n    if pid2 == 0:\n        log = open("/tmp/claude-gallery.log", "w")\n        subprocess.Popen(["/usr/local/bin/claude-gallery-server"], stdout=log, stderr=log, close_fds=True)\n    os._exit(0)\nos.waitpid(pid, 0)\n' > /tmp/start-gallery.py
          python3 /tmp/start-gallery.py
          sleep 4
          cat /tmp/claude-gallery.log || true
          lsof -i :7477 || echo "nothing on port 7477 yet"

      - name: Run smoke tests
        timeout-minutes: 5
        run: bash tests/smoke.sh

      - name: Cleanup
        if: always()
        run: pkill -f claude-gallery-server 2>/dev/null || true


  # ── Publish release (only if both tests pass) ───────────────────────
  release:
    needs: [test-windows, test-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-installer/ClaudeGallery-Setup.exe
            mac-installer/ClaudeGallery-*.pkg
          generate_release_notes: true
