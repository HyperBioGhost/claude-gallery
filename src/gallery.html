<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Gallery</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root {
    --ink: oklch(22% 0.03 260);
    --ink-soft: oklch(38% 0.02 260);
    --ink-faint: oklch(55% 0.015 260);
    --paper: oklch(98.5% 0.005 90);
    --paper-warm: oklch(96.5% 0.012 80);
    --rule: oklch(88% 0.01 260);
    --accent: oklch(58% 0.19 28);
    --accent-2: oklch(48% 0.14 200);
    --highlight: oklch(94% 0.09 95);
    --code-bg: oklch(96% 0.008 260);
    --danger: oklch(55% 0.22 28);
    --success: oklch(52% 0.16 155);
    --card-shadow: 0 2px 8px oklch(0% 0 0 / 0.06), 0 1px 3px oklch(0% 0 0 / 0.04);
    --card-shadow-hover: 0 8px 24px oklch(0% 0 0 / 0.1), 0 2px 8px oklch(0% 0 0 / 0.06);
    --serif: "Iowan Old Style","Palatino Linotype","Palatino","Book Antiqua",Georgia,serif;
    --sans: "Inter","Helvetica Neue","Segoe UI",system-ui,sans-serif;
    --mono: "JetBrains Mono","Consolas","SF Mono",ui-monospace,monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); height: 100%; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  /* ── Homepage ─────────────────────────────────────────────────── */
  #homepage { min-height: 100vh; display: flex; flex-direction: column; }

  .home-header {
    padding: 48px 56px 0;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  .home-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(42px, 6vw, 72px);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  .home-title em { font-style: italic; color: var(--accent); }
  .home-sub {
    font-size: 15px;
    color: var(--ink-faint);
    margin-bottom: 40px;
  }

  /* Search */
  .search-wrap {
    max-width: 560px;
    position: relative;
    margin-bottom: 48px;
  }
  .search-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--ink-faint);
  }
  #search {
    width: 100%;
    padding: 14px 16px 14px 44px;
    font-size: 16px;
    font-family: var(--sans);
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: white;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px oklch(58% 0.19 28 / 0.1);
  }
  #search::placeholder { color: var(--ink-faint); }

  /* Grid */
  .grid-wrap {
    flex: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 56px 80px;
    width: 100%;
  }
  /* Filter chips + grouping */
  .browse-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .type-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .type-chip {
    font-family: var(--sans);
    font-size: 13px;
    padding: 5px 12px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: white;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .type-chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .type-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .type-chip:disabled { opacity: 0.4; cursor: default; }
  .type-chip .chip-count {
    font-family: var(--mono);
    font-size: 12px;
    opacity: 0.75;
    margin-left: 6px;
  }
  .group-wrap { display: flex; align-items: center; gap: 7px; margin-left: auto; }
  .group-wrap label { font-size: 13px; color: var(--ink-faint); }
  .group-select {
    font-family: var(--sans);
    font-size: 13px;
    padding: 5px 10px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: white;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .group-select:hover { border-color: var(--accent); color: var(--accent); }

  /* A header breaks the row it lands on, so each group starts its own row. */
  .group-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    margin-top: 8px;
    /* It is a <button>, so undo the control look and keep the heading's. */
    width: 100%;
    background: none;
    border-left: none;
    border-right: none;
    border-top: none;
    padding-left: 0;
    padding-right: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .group-header:first-of-type { margin-top: 0; }
  .group-header:hover .group-name { color: var(--accent); }
  .group-header:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .group-caret {
    font-size: 11px;
    line-height: 1;
    color: var(--ink-faint);
    transform: rotate(0deg);
    transition: transform 0.15s;
  }
  /* Folded points right, the way a closed folder does. */
  .group-header[aria-expanded="false"] .group-caret { transform: rotate(-90deg); }
  .group-header[aria-expanded="false"] { opacity: 0.75; }
  @media (prefers-reduced-motion: reduce) {
    .group-caret { transition: none; }
  }
  .group-header .group-name {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--ink);
  }
  .group-header .group-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px;
  }
  .card {
    background: white;
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: var(--card-shadow);
    position: relative;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--card-shadow-hover);
  }
  .card-preview {
    height: 160px;
    overflow: hidden;
    background: var(--paper-warm);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-preview iframe {
    width: 200%;
    height: 200%;
    transform: scale(0.5);
    transform-origin: top left;
    border: none;
    pointer-events: none;
    position: absolute;
    top: 0; left: 0;
  }
  .card-preview img {
    max-width: 85%;
    max-height: 85%;
    object-fit: contain;
  }
  .card-preview img.card-thumbnail {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    object-fit: cover;
    object-position: top left;
  }
  .card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
  }
  .card-icon .type-badge {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 5px;
    letter-spacing: 0.04em;
  }
  .type-html { background: oklch(92% 0.06 28); color: oklch(45% 0.16 28); }
  .type-svg { background: oklch(92% 0.06 80); color: oklch(45% 0.14 80); }
  .type-img { background: oklch(92% 0.06 145); color: oklch(40% 0.14 145); }
  .type-md { background: oklch(92% 0.05 260); color: oklch(40% 0.12 260); }
  .type-json { background: oklch(92% 0.06 50); color: oklch(42% 0.16 50); }
  .type-py { background: oklch(92% 0.05 230); color: oklch(40% 0.14 230); }
  .type-js { background: oklch(92% 0.08 95); color: oklch(42% 0.15 95); }
  .type-ts { background: oklch(92% 0.06 240); color: oklch(40% 0.14 240); }
  .type-css { background: oklch(92% 0.06 300); color: oklch(40% 0.14 300); }
  .type-csv { background: oklch(92% 0.05 170); color: oklch(40% 0.12 170); }
  .type-xml { background: oklch(92% 0.05 28); color: oklch(42% 0.12 28); }
  .type-yaml { background: oklch(92% 0.04 350); color: oklch(42% 0.12 350); }
  .type-mmd { background: oklch(92% 0.06 330); color: oklch(42% 0.14 330); }
  .type-txt { background: oklch(94% 0.02 260); color: oklch(45% 0.03 260); }
  .type-file { background: oklch(94% 0.01 260); color: oklch(50% 0.02 260); }

  .card-info {
    padding: 14px 16px;
    border-top: 1px solid var(--rule);
  }
  .card-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .card-meta .badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
  }

  /* Select mode cards */
  .card .select-check {
    display: none;
    position: absolute;
    top: 10px;
    left: 10px;
    width: 20px;
    height: 20px;
    border: 2px solid var(--rule);
    border-radius: 4px;
    background: white;
    cursor: pointer;
    z-index: 5;
    appearance: none;
    -webkit-appearance: none;
  }
  .card .select-check:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .card .select-check:checked::after {
    content: "\2713";
    color: white;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  body.select-mode .card .select-check { display: block; }
  body.select-mode .card { cursor: default; }
  body.select-mode .card:hover { transform: none; }

  /* Home toolbar (select/delete) */
  .home-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
  }
  .home-action-btn {
    background: white;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--sans);
    font-weight: 500;
    transition: all 0.15s;
  }
  .home-action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-action-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .home-action-btn.danger { border-color: var(--danger); color: var(--danger); }
  .home-action-btn.danger:hover { background: var(--danger); color: white; }

  /* Drop overlay */
  #drop-overlay {
    position: fixed;
    inset: 0;
    background: oklch(98.5% 0.005 90 / 0.95);
    backdrop-filter: blur(4px);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #drop-overlay.visible { display: flex; }
  #drop-overlay .drop-box {
    border: 2px dashed var(--accent);
    border-radius: 16px;
    padding: 64px 96px;
    text-align: center;
    background: white;
    box-shadow: var(--card-shadow-hover);
  }
  #drop-overlay .drop-icon {
    font-size: 2.5rem;
    color: var(--accent);
    margin-bottom: 16px;
  }
  #drop-overlay .drop-title {
    font-family: var(--serif);
    font-size: 28px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  #drop-overlay .drop-sub {
    font-size: 14px;
    color: var(--ink-faint);
  }
  #import-status {
    font-size: 12px;
    color: var(--ink-faint);
    margin-left: 4px;
  }
  /* Version sits quietly at the end of the action row. It exists so a bug
     report can name the build it came from. */
  .home-meta {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .version-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.3px;
  }
  .update-pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--accent);
    background: color-mix(in oklch, var(--accent) 10%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
    border-radius: 999px;
    padding: 4px 10px;
    text-decoration: none;
    white-space: nowrap;
  }
  .update-pill:hover { background: var(--accent); color: white; }

  /* Empty state */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-faint);
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 12px; opacity: 0.4; }
  .empty-state .msg { font-size: 14px; }

  /* ── Detail View ──────────────────────────────────────────────── */
  #detail-view { display: none; height: 100vh; flex-direction: column; }
  #detail-view.visible { display: flex; }
  #homepage.hidden { display: none; }

  .detail-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--rule);
    background: white;
    flex-shrink: 0;
    z-index: 20;
  }
  .back-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    font-family: var(--sans);
    transition: all 0.15s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .detail-filename {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toolbar-btn {
    background: white;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--sans);
    font-weight: 500;
    transition: all 0.15s;
    text-decoration: none;
    white-space: nowrap;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .toolbar-btn.primary:hover { opacity: 0.85; color: white; }
  .toolbar-btn.active {
    background: oklch(94% 0.06 28);
    border-color: var(--accent);
    color: var(--accent);
  }
  .toolbar-btn[style*="display: none"] { display: none; }

  /* Save status */
  .save-status {
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .save-status.success { color: var(--success); }
  .save-status a { color: inherit; font-weight: 600; text-decoration: underline;
                   text-underline-offset: 2px; cursor: pointer; }
  .save-status.error { color: var(--danger); }

  /* Export dropdown */
  .export-wrap {
    position: relative;
    display: inline-block;
  }
  .export-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 4px;
    background: white;
    border: 1px solid var(--rule);
    border-radius: 8px;
    min-width: 220px;
    box-shadow: 0 8px 24px oklch(0% 0 0 / 0.12);
    z-index: 100;
    overflow: hidden;
    display: none;
  }
  .export-menu.visible { display: block; }
  .export-item {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.1s;
    white-space: nowrap;
  }
  .export-item:hover { background: oklch(96% 0.04 28); color: var(--accent); }

  .detail-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Sidebar (hidden by default in detail) */
  .detail-sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--paper-warm);
    border-right: 1px solid var(--rule);
    overflow-y: auto;
    display: none;
    flex-shrink: 0;
  }
  .detail-sidebar.visible { display: block; }
  .sidebar-file {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 1px solid oklch(92% 0.005 260);
    transition: background 0.1s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-file:hover { background: white; }
  .sidebar-file.active { background: white; color: var(--accent); font-weight: 500; }

  .detail-preview {
    flex: 1;
    overflow: hidden;
    background: white;
    position: relative;
  }
  .detail-preview iframe {
    width: 100%; height: 100%; border: none;
  }
  .detail-preview img {
    max-width: 90%; max-height: 90%;
    object-fit: contain;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .detail-preview .text-view {
    width: 100%; height: 100%;
    overflow: auto;
    padding: 32px 40px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ── Editor ───────────────────────────────────────────────────── */
  .editor-wrap {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
  }
  .editor-wrap.visible { display: flex; }
  .editor-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .editor-left {
    flex: 0 0 50%;
    display: flex;
    flex-direction: column;
    min-width: 80px;
  }
  .editor-right {
    flex: 1;
    display: none;
    flex-direction: column;
    min-width: 80px;
    overflow: hidden;
  }
  .editor-right.visible { display: flex; }
  .editor-live {
    flex: 1;
    overflow: auto;
  }
  /* Document-rendered previews: the iframe owns its own scrollbar */
  .editor-live.editor-live-frame {
    overflow: hidden;
    padding: 0;
    background: white;
  }
  .editor-live-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: white;
  }
  .editor-textarea {
    flex: 1;
    background: var(--code-bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    padding: 20px 24px;
    border: none;
    resize: none;
    outline: none;
    tab-size: 4;
  }

  /* ── Split pane ───────────────────────────────────────────────── */
  .split-pane { display: flex; width: 100%; height: 100%; overflow: hidden; }
  .split-half { flex: 0 0 50%; display: flex; flex-direction: column; overflow: hidden; min-width: 80px; }
  .split-half:last-child { flex: 1; }
  .split-label {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-warm);
    flex-shrink: 0;
    font-weight: 500;
  }
  .split-scroll { flex: 1; overflow: auto; }

  /* Preview: the source side leaves rather than shrinks, and what remains is
     read as a document. The pane still fills the frame; the prose caps its own
     measure at 72ch and centres, while tables keep the column's full width. */
  .split-pane.preview-only > .split-half:first-child,
  .split-pane.preview-only > .divider { display: none; }
  .split-pane.preview-only > .split-half:last-child { flex: 1 1 100%; }
  .split-pane.preview-only .split-label { display: none; }
  .split-pane.preview-only .split-scroll { background: var(--paper); }
  .split-pane.preview-only .md-rendered {
    font-size: 18px;
    max-width: 72ch;
    margin: 0 auto;
    padding: 64px clamp(20px, 4vw, 48px) 120px;
  }
  /* A pretty-printed JSON or a diagram is not prose, so it gets room instead
     of a reading measure. */
  .split-pane.preview-only .code-block,
  .split-pane.preview-only .mermaid-stage { max-width: none; }

  /* Divider */
  .divider {
    width: 5px;
    background: var(--rule);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
    position: relative;
    z-index: 10;
  }
  .divider:hover, .divider.dragging { background: var(--accent); }

  /* ── Syntax highlight overrides ──────────────────────────────── */
  .hljs-wrap { width: 100%; min-height: 100%; overflow: visible; }
  .hljs-wrap pre { margin: 0; min-height: 100%; }
  .hljs-wrap pre code.hljs {
    font-family: var(--mono) !important;
    font-size: 13px !important;
    line-height: 1.65 !important;
    padding: 20px 24px !important;
    background: var(--code-bg) !important;
    display: block;
    white-space: pre;
    tab-size: 4;
  }

  /* ── Markdown rendered ──────────────────────────────────────── */
  .md-rendered {
    padding: 28px 32px;
    color: var(--ink);
    line-height: 1.75;
    font-size: 16px;
  }
  .md-rendered h1, .md-rendered h2, .md-rendered h3,
  .md-rendered h4, .md-rendered h5, .md-rendered h6 {
    color: var(--ink);
    margin: 1.4em 0 0.5em;
    font-weight: 600;
    font-family: var(--serif);
  }
  .md-rendered h1 { font-size: 1.6em; border-bottom: 1px solid var(--rule); padding-bottom: 0.3em; }
  .md-rendered h2 { font-size: 1.3em; }
  .md-rendered h3 { font-size: 1.1em; }
  .md-rendered p { margin: 0.6em 0; }
  .md-rendered strong { color: var(--ink); }
  .md-rendered em { color: var(--ink-soft); }
  .md-rendered code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 0.85em;
    color: var(--accent);
  }
  .md-rendered pre {
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0.8em 0;
  }
  .md-rendered pre code { background: none; padding: 0; color: var(--ink); font-size: 0.85em; }
  .md-rendered a { color: var(--accent-2); text-decoration: none; }
  .md-rendered a:hover { text-decoration: underline; }
  .md-rendered ul, .md-rendered ol { padding-left: 1.6em; margin: 0.5em 0; }
  .md-rendered li { margin: 0.3em 0; }
  .md-rendered table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.9em; }
  .md-rendered th { background: var(--paper-warm); color: var(--ink); padding: 8px 12px; text-align: left; border-bottom: 2px solid var(--rule); font-weight: 600; }
  .md-rendered td { padding: 7px 12px; border-bottom: 1px solid var(--rule); }
  .md-rendered blockquote { border-left: 3px solid var(--accent); padding: 4px 14px; color: var(--ink-soft); margin: 0.8em 0; background: var(--paper-warm); border-radius: 0 6px 6px 0; }
  .md-rendered hr { border: none; border-top: 1px solid var(--rule); margin: 1.4em 0; }
  .md-rendered img { max-width: 100%; border-radius: 6px; }

  /* ── CSV table ──────────────────────────────────────────────── */
  .csv-preview { width: 100%; height: 100%; overflow: auto; padding: 20px 24px; }
  .csv-preview table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .csv-preview th { background: var(--paper-warm); color: var(--ink); padding: 9px 14px; text-align: left; border-bottom: 2px solid var(--rule); white-space: nowrap; position: sticky; top: 0; font-weight: 600; font-size: 12px; }
  .csv-preview td { padding: 8px 14px; border-bottom: 1px solid var(--rule); color: var(--ink-soft); white-space: nowrap; }
  .csv-preview tr:hover td { background: var(--paper-warm); }
  .csv-preview .row-count { font-size: 11px; color: var(--ink-faint); margin-bottom: 12px; }

  /* Hamburger */
  .hamburger {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 6px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: border-color 0.15s;
  }
  .hamburger:hover { border-color: var(--accent); }
  .hamburger span {
    display: block;
    width: 16px;
    height: 2px;
    background: var(--ink-soft);

  }

  /* ── Server down ────────────────────────────────────────────── */
  .server-down {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    padding: 40px;
    text-align: center;
  }
  .server-down .icon { font-size: 2.5rem; opacity: 0.3; }
  .server-down .title { color: var(--danger); font-size: 16px; font-weight: 600; }
  .server-down .desc { color: var(--ink-faint); font-size: 13px; line-height: 1.8; max-width: 400px; }
  .server-down button {
    margin-top: 12px;
    background: white;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--sans);
  }
  .server-down button:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 768px) {
    .home-header { padding: 32px 24px 0; }
    .grid-wrap { padding: 0 24px 60px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card-preview { height: 120px; }
  }
</style>
</head>
<body>

<!-- ═══ HOMEPAGE ═══ -->
<div id="homepage">
  <div class="home-header">
    <h1 class="home-title"><em>Gallery</em></h1>
    <p class="home-sub" id="file-count">Loading artifacts...</p>
    <div class="search-wrap">

  </div>
  <div class="grid-wrap">

</div>

<!-- ═══ DETAIL VIEW ═══ -->
<div id="detail-view">
  <div class="detail-toolbar">
    <button class="back-btn" onclick="goHome()">&#8592; Back</button>
    <button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
    <span class="detail-filename" id="detail-filename"></span>

    <button class="toolbar-btn" id="edit-btn" onclick="toggleEdit()" style="display:none">Edit</button>
    <button class="toolbar-btn primary" id="save-btn" onclick="saveEdit()" style="display:none">Save</button>
    <button class="toolbar-btn" id="saveas-btn" onclick="saveAs()">Save As</button>
    <div class="export-wrap" id="export-wrap" style="display:none">

  <div class="detail-body">

    <div class="detail-preview" id="detail-preview">
      <!-- Editor overlay -->
      <div class="editor-wrap" id="editor-wrap">
        <div class="editor-body" id="editor-body">
          <div class="editor-left" id="editor-left">
            <div class="split-label" id="editor-left-label">Edit</div>
            <textarea class="editor-textarea" id="editor-textarea" spellcheck="false"></textarea>
          </div>
          <div class="divider" id="editor-divider"></div>
          <div class="editor-right" id="editor-right">
            <div class="split-label">Live Preview</div>
            <div class="editor-live" id="editor-live"></div>
          </div>
        </div>
      </div>
