<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kiro Artifact Gallery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f14;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 240px;
      min-width: 240px;
      background: #16161f;
      border-right: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a3a;
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc88;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #conn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #conn-dot.connected { background: #00ffcc; box-shadow: 0 0 8px #00ffcc; }
    #conn-dot.flash { background: #fff; box-shadow: 0 0 14px #fff; }
    #file-list { overflow-y: auto; flex: 1; padding: 8px 0; }
    #sidebar-actions {
      padding: 8px 12px;
      border-top: 1px solid #2a2a3a;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .sidebar-btn {
      flex: 1;
      background: #7c3aed22;
      border: 1px solid #7c3aed55;
      color: #a78bfa;
      padding: 10px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      text-align: center;
      transition: all 0.15s;
      font-weight: 500;
    }
    .sidebar-btn:hover { background: #7c3aed44; color: #c4b5fd; }
    .sidebar-btn.active { background: #00ffcc22; border-color: #00ffcc55; color: #00ffcc; }
    .sidebar-btn.danger { background: #ff6b6b22; border-color: #ff6b6b55; color: #ff6b6b; }
    .sidebar-btn.danger:hover { background: #ff6b6b44; }
    .file-item .select-check {
      display: none;
      width: 14px; height: 14px;
      border: 1px solid #555;
      border-radius: 3px;
      margin-right: 8px;
      flex-shrink: 0;
      cursor: pointer;
      appearance: none;
      background: transparent;
      vertical-align: middle;
    }
    .file-item .select-check:checked { background: #00ffcc; border-color: #00ffcc; }
    body.select-mode .file-item .select-check { display: inline-block; }
    body.select-mode .file-item { display: flex; align-items: center; }
    .file-item {
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      font-size: 0.8rem;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item:hover { background: #1e1e2a; color: #fff; }
    .file-item.active { border-left-color: #00ffcc; background: #1a1a26; color: #00ffcc; }
    .badge {
      display: inline-block;
      font-size: 0.6rem;
      padding: 1px 5px;
      border-radius: 3px;
      margin-right: 6px;
      text-transform: uppercase;
      font-weight: bold;
      vertical-align: middle;
    }
    .badge-html { background: #e34c2622; color: #e34c26; }
    .badge-svg  { background: #ffb30022; color: #ffb300; }
    .badge-img  { background: #4caf5022; color: #4caf50; }
    .badge-md   { background: #2196f322; color: #2196f3; }
    .badge-txt  { background: #9c27b022; color: #ce93d8; }
    .badge-json { background: #ff572222; color: #ff7043; }
    .badge-py   { background: #3572a522; color: #6fb3d9; }
    .badge-js   { background: #f7df1e22; color: #f7df1e; }
    .badge-ts   { background: #3178c622; color: #5aa0e8; }
    .badge-css  { background: #56439922; color: #9d7fe0; }
    .badge-csv  { background: #00968822; color: #26c6a0; }
    .badge-xml  { background: #e34c2622; color: #e8864a; }
    .badge-yaml { background: #cb171e22; color: #f06b6b; }
    .badge-mmd  { background: #ff338822; color: #ff79a8; }
    .badge-file { background: #55555522; color: #aaa; }
    .file-item .ts { display: block; font-size: 0.6rem; color: #555; margin-top: 2px; }
    .new-flash { animation: newflash 2s ease-out forwards; }
    @keyframes newflash {
      0%   { background: #00ffcc22; border-left-color: #00ffcc; color: #00ffcc; }
      100% { background: transparent; border-left-color: transparent; color: #aaa; }
    }
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #toolbar {
      padding: 10px 16px;
      background: #16161f;
      border-bottom: 1px solid #2a2a3a;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      color: #666;
      flex-shrink: 0;
      z-index: 20;
      position: sticky;
      top: 0;
    }
    #current-file { color: #ccc; font-weight: 500; flex: 1; }
    #open-btn {
      background: #1e1e2a;
      border: 1px solid #2a2a3a;
      color: #aaa;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: all 0.15s;
      text-decoration: none;
    }
    #open-btn:hover { background: #2a2a3a; color: #fff; }
    #edit-btn {
      background: #1e1e2a;
      border: 1px solid #2a2a3a;
      color: #aaa;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: all 0.15s;
      display: none;
    }
    #edit-btn:hover { background: #2a2a3a; color: #fff; }
    #edit-btn.active { background: #00ffcc22; border-color: #00ffcc55; color: #00ffcc; }
    #editor-wrap { display: none; width: 100%; height: 100%; flex-direction: column; }
    #editor-wrap.visible { display: flex; }
    #editor-body { flex: 1; display: flex; overflow: hidden; }
    #editor-left { flex: 0 0 50%; display: flex; flex-direction: column; min-width: 80px; }
    #editor-right { flex: 1; display: none; flex-direction: column; min-width: 80px; overflow: hidden; }
    #editor-right.visible { display: flex; }
    #editor-live { flex: 1; overflow: auto; }
    #editor-textarea {
      flex: 1;
      background: #0d0d12;
      color: #d0d0d0;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8rem;
      line-height: 1.65;
      padding: 20px 24px;
      border: none;
      resize: none;
      outline: none;
      tab-size: 4;
    }
    #save-status { font-size: 0.65rem; color: #555; }
    #save-btn {
      background: #00ffcc22;
      border: 1px solid #00ffcc55;
      color: #00ffcc;
      padding: 4px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: all 0.15s;
    }
    #save-btn:hover { background: #00ffcc44; }
    #saveas-btn {
      background: #1e1e2a;
      border: 1px solid #2a2a3a;
      color: #aaa;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: all 0.15s;
    }
    #saveas-btn:hover { background: #2a2a3a; color: #fff; }
    #export-dropdown-wrap { position: relative; display: inline-block; }
    #export-btn {
      background: #1e1e2a;
      border: 1px solid #2a2a3a;
      color: #aaa;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: all 0.15s;
    }
    #export-btn:hover { background: #2a2a3a; color: #fff; }
    #export-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: #1e1e2a;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      min-width: 200px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
      overflow: hidden;
    }
    .export-item {
      padding: 8px 14px;
      font-size: 0.72rem;
      color: #ccc;
      cursor: pointer;
      transition: background 0.1s;
      white-space: nowrap;
    }
    .export-item:hover { background: #00ffcc22; color: #00ffcc; }
    #preview-area { flex: 1; overflow: hidden; position: relative; background: #0f0f14; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }

    /* ── Image ── */
    #img-preview {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center; overflow: auto;
    }
    #img-preview img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 4px; box-shadow: 0 4px 40px #00000080; }

    /* ── Plain text fallback ── */
    #text-preview {
      width: 100%; height: 100%;
      overflow: auto; padding: 24px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem; line-height: 1.6; color: #ccc;
      white-space: pre-wrap; word-break: break-all;
    }

    /* ── CSV table ── */
    #csv-preview { width: 100%; height: 100%; overflow: auto; padding: 16px; }
    #csv-preview table { border-collapse: collapse; font-size: 0.78rem; min-width: 100%; }
    #csv-preview th { background: #1e1e2a; color: #00ffcc; padding: 7px 12px; text-align: left; border-bottom: 2px solid #2a2a3a; white-space: nowrap; position: sticky; top: 0; }
    #csv-preview td { padding: 6px 12px; border-bottom: 1px solid #1a1a24; color: #ccc; white-space: nowrap; }
    #csv-preview tr:hover td { background: #1a1a26; }
    #csv-preview .row-count { font-size: 0.65rem; color: #555; margin-bottom: 10px; }

    /* ── Split pane (md / json) ── */
    .split-pane { display: flex; width: 100%; height: 100%; overflow: hidden; }
    .split-half { flex: 0 0 50%; display: flex; flex-direction: column; overflow: hidden; min-width: 80px; }
    .split-half:last-child { flex: 1; }
    .divider {
      width: 5px;
      background: #1a1a24;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      position: relative;
      z-index: 10;
    }
    .divider:hover, .divider.dragging { background: #00ffcc55; }
    .split-label {
      font-size: 0.6rem; color: #555; letter-spacing: 2px;
      text-transform: uppercase; padding: 5px 14px;
      border-bottom: 1px solid #1a1a24; background: #0d0d12;
      flex-shrink: 0;
    }
    .split-scroll { flex: 1; overflow: auto; }

    /* ── Syntax highlight (hljs overrides) ── */
    .hljs-wrap { width: 100%; min-height: 100%; overflow: visible; }
    .hljs-wrap pre { margin: 0; min-height: 100%; }
    .hljs-wrap pre code.hljs {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace !important;
      font-size: 0.78rem !important;
      line-height: 1.65 !important;
      padding: 20px 24px !important;
      background: #0f0f14 !important;
      display: block;
      white-space: pre;
      tab-size: 4;
    }

    /* ── Markdown rendered ── */
    .md-rendered {
      padding: 24px 28px;
      color: #d0d0d0;
      line-height: 1.75;
      font-size: 0.85rem;
    }
    .md-rendered h1, .md-rendered h2, .md-rendered h3,
    .md-rendered h4, .md-rendered h5, .md-rendered h6 { color: #00ffcc; margin: 1.4em 0 0.5em; font-weight: 600; }
    .md-rendered h1 { font-size: 1.5rem; border-bottom: 1px solid #2a2a3a; padding-bottom: 0.3em; }
    .md-rendered h2 { font-size: 1.2rem; }
    .md-rendered h3 { font-size: 1rem; }
    .md-rendered p { margin: 0.6em 0; }
    .md-rendered strong { color: #fff; }
    .md-rendered em { color: #b0c4de; }
    .md-rendered code {
      background: #1e1e2a; padding: 2px 6px; border-radius: 3px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.82em; color: #00ffcc;
    }
    .md-rendered pre {
      background: #1a1a24; border: 1px solid #2a2a3a;
      border-radius: 5px; padding: 14px 16px; overflow-x: auto; margin: 0.8em 0;
    }
    .md-rendered pre code { background: none; padding: 0; color: #ccc; font-size: 0.8em; }
    .md-rendered a { color: #6fb3d9; text-decoration: none; }
    .md-rendered a:hover { text-decoration: underline; }
    .md-rendered ul, .md-rendered ol { padding-left: 1.6em; margin: 0.5em 0; }
    .md-rendered li { margin: 0.3em 0; }
    .md-rendered table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.82rem; }
    .md-rendered th { background: #1e1e2a; color: #00ffcc; padding: 6px 12px; text-align: left; border-bottom: 2px solid #2a2a3a; }
    .md-rendered td { padding: 5px 12px; border-bottom: 1px solid #1a1a24; }
    .md-rendered blockquote { border-left: 3px solid #00ffcc55; padding: 4px 12px; color: #888; margin: 0.8em 0; background: #1a1a2a; border-radius: 0 4px 4px 0; }
    .md-rendered hr { border: none; border-top: 1px solid #2a2a3a; margin: 1.4em 0; }
    .md-rendered img { max-width: 100%; border-radius: 4px; }

    /* ── Empty state ── */
    #empty-state {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #2a2a3a; gap: 12px;
    }
    #empty-state .icon { font-size: 3rem; }
    #empty-state .msg { font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; }

    #status-bar {
      padding: 5px 16px;
      background: #0d0d12;
      border-top: 1px solid #1a1a24;
      font-size: 0.65rem;
      color: #444;
      display: flex;
      gap: 16px;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header"><div id="conn-dot"></div>Artifacts</div>
    <div id="file-list"></div>
    <div id="sidebar-actions">
      <button class="sidebar-btn" id="select-btn" onclick="toggleSelectMode()">Select</button>
      <button class="sidebar-btn danger" id="delete-btn" onclick="deleteSelected()" style="display:none">Delete</button>
    </div>
  </div>
  <div id="main">
    <div id="toolbar">
      <span id="current-file">Waiting...</span>
      <button id="edit-btn" onclick="toggleEdit()">Edit</button>
      <span id="save-status"></span>
      <button id="save-btn" onclick="saveEdit()" style="display:none">Save to disk</button>
      <button id="saveas-btn" onclick="saveAs()">Save As</button>
      <div id="export-dropdown-wrap" style="display:none">
        <button id="export-btn" onclick="toggleExportMenu()">Export as &#9662;</button>
        <div id="export-menu" style="display:none"></div>
      </div>
      <a id="open-btn" href="#" target="_blank">Open in tab &#8599;</a>
    </div>
    <div id="editor-wrap">
      <div id="editor-body">
        <div id="editor-left">
          <div class="split-label" id="editor-left-label">Edit</div>
          <textarea id="editor-textarea" spellcheck="false"></textarea>
        </div>
        <div class="divider" id="editor-divider"></div>
        <div id="editor-right">
          <div class="split-label">Live Preview</div>
          <div id="editor-live"></div>
        </div>
      </div>
    </div>
    <div id="preview-area">
      <div id="empty-state">
        <div class="icon">&#10022;</div>
        <div class="msg">Waiting for artifacts</div>
      </div>
    </div>
    <div id="status-bar">
      <span id="file-count">0 files</span>
      <span id="conn-status">Connecting...</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1/dist/html2canvas.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'dark' });</script>
  <script>
    const dot = document.getElementById('conn-dot');
    const connStatus = document.getElementById('conn-status');
    let files = [], activeFile = null;
    const EDITABLE = ['md','json','py','js','ts','css','txt','csv','xml','yaml','yml','mermaid','mmd'];

    let livePreviewExt = null;

    function makeDraggable(divider, leftEl, container) {
      divider.addEventListener('mousedown', e => {
        e.preventDefault();
        divider.classList.add('dragging');
        const startX = e.clientX;
        const startW = leftEl.getBoundingClientRect().width;
        const totalW = container.getBoundingClientRect().width;

        function onMove(e) {
          const delta = e.clientX - startX;
          const newW = Math.min(Math.max(startW + delta, 80), totalW - 85);
          leftEl.style.flex = `0 0 ${newW}px`;
        }
        function onUp() {
          divider.classList.remove('dragging');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function updateLivePreview(text) {
      const live = document.getElementById('editor-live');
      if (livePreviewExt === 'md') {
        live.className = 'md-rendered';
        live.style.padding = '24px 28px';
        live.innerHTML = marked.parse(text);
      } else if (livePreviewExt === 'json') {
        live.className = '';
        live.innerHTML = '';
        try {
          const pretty = JSON.stringify(JSON.parse(text), null, 2);
          const block = makeCodeBlock(pretty, 'json');
          block.style.height = '100%';
          live.appendChild(block);
        } catch {
          live.style.cssText = 'padding:20px;color:#ff6b6b;font-size:0.8rem';
          live.textContent = 'Invalid JSON';
        }
      } else if (livePreviewExt === 'csv') {
        live.className = '';
        live.innerHTML = '';
        live.style.cssText = 'padding:16px;overflow:auto';
        const rows = text.trim().split('\n').map(line => {
          const cells = []; let cur = '', inQ = false;
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') { inQ = !inQ; }
            else if (c === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
            else { cur += c; }
          }
          cells.push(cur.trim());
          return cells;
        });
        if (rows.length <= 1 && !rows[0][0]) {
          live.innerHTML = '<div style="color:#555;font-size:0.75rem;padding:20px">Live table preview will appear as you edit</div>';
          return;
        }
        const table = document.createElement('table');
        table.style.cssText = 'border-collapse:collapse;font-size:0.78rem;min-width:100%';
        rows.forEach((row, i) => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement(i === 0 ? 'th' : 'td');
            td.textContent = cell.replace(/^"|"$/g, '');
            td.style.cssText = i === 0
              ? 'background:#1e1e2a;color:#00ffcc;padding:7px 12px;text-align:left;border-bottom:2px solid #2a2a3a;white-space:nowrap'
              : 'padding:6px 12px;border-bottom:1px solid #1a1a24;color:#ccc;white-space:nowrap';
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        live.appendChild(table);
      } else if (['mermaid','mmd'].includes(livePreviewExt)) {
        live.className = '';
        live.innerHTML = '';
        live.style.cssText = 'padding:24px;display:flex;align-items:center;justify-content:center;min-height:100%;background:#1a1a24';
        try {
          const id = 'mmd-live-' + Date.now();
          mermaid.render(id, text).then(({ svg }) => { live.innerHTML = svg; })
            .catch(err => { live.style.cssText = 'padding:20px;color:#ff6b6b;font-size:0.8rem'; live.textContent = 'Mermaid error: ' + err.message; });
        } catch(err) {
          live.style.cssText = 'padding:20px;color:#ff6b6b;font-size:0.8rem';
          live.textContent = 'Mermaid error: ' + err.message;
        }
      }
    }

    function toggleEdit() {
      const btn = document.getElementById('edit-btn');
      const wrap = document.getElementById('editor-wrap');
      const area = document.getElementById('preview-area');
      if (wrap.classList.contains('visible')) {
        cancelEdit();
      } else {
        const e = getExt(activeFile.name);
        const url = '/files/' + encodeURIComponent(activeFile.name);
        fetch(url).then(r => r.text()).then(text => {
          const ta = document.getElementById('editor-textarea');
          const right = document.getElementById('editor-right');
          ta.value = text;
          document.getElementById('save-status').textContent = activeFile.name;

          // show live pane only for md and json
          livePreviewExt = ['md','json','csv','mermaid','mmd'].includes(e) ? e : null;
          if (livePreviewExt) {
            right.classList.add('visible');
            document.getElementById('editor-left-label').textContent = 'Edit';
            updateLivePreview(text);
            ta.oninput = () => updateLivePreview(ta.value);
            const live = document.getElementById('editor-live');
            ta.onscroll = () => {
              const maxS = ta.scrollHeight - ta.clientHeight;
              const pct = maxS > 0 ? ta.scrollTop / maxS : 0;
              live.scrollTop = pct * (live.scrollHeight - live.clientHeight);
            };
            const edDiv = document.getElementById('editor-divider');
            const edBody = document.getElementById('editor-body');
            const edLeft = document.getElementById('editor-left');
            edLeft.style.flex = '0 0 50%';
            makeDraggable(edDiv, edLeft, edBody);
          } else {
            right.classList.remove('visible');
            document.getElementById('editor-left-label').textContent = 'Edit — ' + activeFile.name;
            ta.oninput = null;
          }

          wrap.classList.add('visible');
          area.style.display = 'none';
          btn.classList.add('active');
          btn.textContent = 'Cancel';
          document.getElementById('save-btn').style.display = 'inline-block';
          ta.focus();
        });
      }
    }

    function cancelEdit() {
      const wrap = document.getElementById('editor-wrap');
      wrap.classList.remove('visible');
      document.getElementById('editor-right').classList.remove('visible');
      document.getElementById('editor-textarea').oninput = null;
      document.getElementById('editor-textarea').onscroll = null;
      document.getElementById('preview-area').style.display = '';
      document.getElementById('save-btn').style.display = 'none';
      const btn = document.getElementById('edit-btn');
      btn.classList.remove('active');
      btn.textContent = 'Edit';
      livePreviewExt = null;
    }

    async function saveEdit() {
      const content = document.getElementById('editor-textarea').value;
      const status = document.getElementById('save-status');
      status.textContent = 'Saving...';
      status.style.color = '#aaa';
      try {
        const res = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file: activeFile.name, content })
        });
        if (res.ok) {
          status.textContent = 'Saved.';
          status.style.color = '#00ffcc';
          setTimeout(() => { status.textContent = activeFile.name; status.style.color = '#555'; }, 2000);
          cancelEdit();
          selectFile(activeFile);
        } else {
          status.textContent = 'Save failed (' + res.status + ')';
          status.style.color = '#ff6b6b';
        }
      } catch(e) {
        status.textContent = 'Error: ' + e.message;
        status.style.color = '#ff6b6b';
      }
    }

    async function saveAs() {
      if (!activeFile) return;
      const url = '/files/' + encodeURIComponent(activeFile.name);
      const res = await fetch(url);
      const blob = await res.blob();

      if (window.showSaveFilePicker) {
        const ext = activeFile.name.includes('.') ? activeFile.name.split('.').pop().toLowerCase() : '';
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: activeFile.name,
            types: ext ? [{ description: ext.toUpperCase() + ' file', accept: { [blob.type || 'application/octet-stream']: ['.' + ext] } }] : []
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
        } catch(e) {
          if (e.name !== 'AbortError') alert('Save failed: ' + e.message);
          return;
        }
      } else {
        downloadBlob(blob, activeFile.name);
      }
      const status = document.getElementById('save-status');
      status.textContent = 'Exported.';
      status.style.color = '#00ffcc';
      setTimeout(() => { status.textContent = ''; status.style.color = '#555'; }, 2000);
    }

    // ── Export as (file type conversion) ─────────────────────────────

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function getExportOptions(ext) {
      if (ext === 'md') return [
        { label: 'HTML document (.html)', action: exportMdToHtml },
        { label: 'PDF (via print)', action: exportMdToPdf },
        { label: 'Word-compatible (.doc)', action: exportMdToDoc },
      ];
      if (['html','htm'].includes(ext)) return [
        { label: 'PDF (via print)', action: exportHtmlToPdf },
        { label: 'Screenshot (.png)', action: exportHtmlToPng },
      ];
      if (['mermaid','mmd'].includes(ext)) return [
        { label: 'SVG image (.svg)', action: exportMermaidToSvg },
        { label: 'PNG image (.png)', action: exportMermaidToPng },
      ];
      return [];
    }

    function toggleExportMenu() {
      const menu = document.getElementById('export-menu');
      if (menu.style.display !== 'none') { menu.style.display = 'none'; return; }
      if (!activeFile) return;
      const options = getExportOptions(getExt(activeFile.name));
      if (!options.length) return;
      menu.innerHTML = '';
      options.forEach(opt => {
        const item = document.createElement('div');
        item.className = 'export-item';
        item.textContent = opt.label;
        item.onclick = () => { menu.style.display = 'none'; opt.action(); };
        menu.appendChild(item);
      });
      menu.style.display = 'block';
    }

    document.addEventListener('click', e => {
      const wrap = document.getElementById('export-dropdown-wrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('export-menu').style.display = 'none';
      }
    });

    async function exportMdToHtml() {
      const text = await (await fetch('/files/' + encodeURIComponent(activeFile.name))).text();
      const rendered = marked.parse(text);
      const title = activeFile.name.replace(/\.md$/i, '');
      const html = `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<title>${title}</title>\n<style>\n  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.7; color: #333; }\n  pre { background: #f5f5f5; padding: 14px; border-radius: 5px; overflow-x: auto; }\n  code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }\n  pre code { background: none; padding: 0; }\n  blockquote { border-left: 3px solid #ddd; margin: 1em 0; padding: 0.5em 1em; color: #666; }\n  table { border-collapse: collapse; width: 100%; margin: 1em 0; }\n  th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }\n  th { background: #f5f5f5; }\n  img { max-width: 100%; }\n</style>\n</head>\n<body>\n${rendered}\n</body>\n</html>`;
      downloadBlob(new Blob([html], { type: 'text/html' }), title + '.html');
    }

    async function exportMdToPdf() {
      const text = await (await fetch('/files/' + encodeURIComponent(activeFile.name))).text();
      const rendered = marked.parse(text);
      const w = window.open('', '_blank');
      w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${activeFile.name}</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.7;color:#333}pre{background:#f5f5f5;padding:14px;border-radius:5px;overflow-x:auto}code{background:#f0f0f0;padding:2px 5px;border-radius:3px}pre code{background:none;padding:0}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px 12px}th{background:#f5f5f5}</style></head><body>${rendered}</body></html>`);
      w.document.close();
      setTimeout(() => w.print(), 500);
    }

    async function exportMdToDoc() {
      const text = await (await fetch('/files/' + encodeURIComponent(activeFile.name))).text();
      const rendered = marked.parse(text);
      const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><title>${activeFile.name}</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]--><style>body{font-family:Calibri,sans-serif;line-height:1.6}table{border-collapse:collapse}th,td{border:1px solid #999;padding:6px 10px}</style></head><body>${rendered}</body></html>`;
      downloadBlob(new Blob([doc], { type: 'application/msword' }), activeFile.name.replace(/\.md$/i, '.doc'));
    }

    function exportHtmlToPdf() {
      const w = window.open('/files/' + encodeURIComponent(activeFile.name), '_blank');
      setTimeout(() => w.print(), 1000);
    }

    async function exportHtmlToPng() {
      const iframe = document.querySelector('#preview-area iframe');
      if (!iframe) { alert('No preview found'); return; }
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        const canvas = await html2canvas(iframeDoc.body, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
        canvas.toBlob(blob => {
          downloadBlob(blob, activeFile.name.replace(/\.(html|htm)$/i, '.png'));
        }, 'image/png');
      } catch(e) {
        alert('Screenshot failed: ' + e.message + '\n\nTip: Try "Open in tab" and use your OS screenshot tool instead.');
      }
    }

    function exportMermaidToSvg() {
      const svgEl = document.querySelector('#preview-area .split-half:last-child svg') ||
                    document.querySelector('#editor-live svg');
      if (!svgEl) { alert('No rendered diagram found.'); return; }
      const svgData = new XMLSerializer().serializeToString(svgEl);
      downloadBlob(new Blob([svgData], { type: 'image/svg+xml' }), activeFile.name.replace(/\.(mermaid|mmd)$/i, '.svg'));
    }

    async function exportMermaidToPng() {
      const svgEl = document.querySelector('#preview-area .split-half:last-child svg') ||
                    document.querySelector('#editor-live svg');
      if (!svgEl) { alert('No rendered diagram found.'); return; }
      const svgData = new XMLSerializer().serializeToString(svgEl);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth * scale;
        canvas.height = img.naturalHeight * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(svgUrl);
        canvas.toBlob(blob => {
          downloadBlob(blob, activeFile.name.replace(/\.(mermaid|mmd)$/i, '.png'));
        }, 'image/png');
      };
      img.onerror = () => { URL.revokeObjectURL(svgUrl); alert('Failed to rasterize SVG to PNG.'); };
      img.src = svgUrl;
    }

    function getExt(name) { return name.includes('.') ? name.split('.').pop().toLowerCase() : ''; }

    function badge(name) {
      const e = getExt(name);
      const map = {
        html:'html', htm:'html', svg:'svg',
        png:'img', jpg:'img', jpeg:'img', gif:'img', webp:'img',
        md:'md', txt:'txt',
        json:'json', py:'py',
        js:'js', ts:'ts', css:'css',
        csv:'csv',
        xml:'xml', yaml:'yaml', yml:'yaml',
        mermaid:'mmd', mmd:'mmd'
      };
      return map[e] || 'file';
    }

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 5)  return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      return Math.floor(s/3600) + 'h ago';
    }

    // ── Helpers ────────────────────────────────────────────────────────

    function makeCodeBlock(text, lang) {
      const wrap = document.createElement('div');
      wrap.className = 'hljs-wrap';
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.className = `language-${lang}`;
      code.textContent = text;
      pre.appendChild(code);
      wrap.appendChild(pre);
      // highlight after appending so hljs can read dimensions
      requestAnimationFrame(() => hljs.highlightElement(code));
      return wrap;
    }

    function syncScroll(source, target) {
      let ticking = false;
      source.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          const maxS = source.scrollHeight - source.clientHeight;
          const pct = maxS > 0 ? source.scrollTop / maxS : 0;
          const maxT = target.scrollHeight - target.clientHeight;
          target.scrollTop = pct * maxT;
          ticking = false;
        });
      });
    }

    function makeSplitPane(leftLabel, leftEl, rightLabel, rightEl, sync) {
      const pane = document.createElement('div');
      pane.className = 'split-pane';

      const left = document.createElement('div');
      left.className = 'split-half';
      const lLabel = document.createElement('div');
      lLabel.className = 'split-label';
      lLabel.textContent = leftLabel;
      const lScroll = document.createElement('div');
      lScroll.className = 'split-scroll';
      lScroll.appendChild(leftEl);
      left.appendChild(lLabel);
      left.appendChild(lScroll);

      const right = document.createElement('div');
      right.className = 'split-half';
      const rLabel = document.createElement('div');
      rLabel.className = 'split-label';
      rLabel.textContent = rightLabel;
      const rScroll = document.createElement('div');
      rScroll.className = 'split-scroll';
      rScroll.appendChild(rightEl);
      right.appendChild(rLabel);
      right.appendChild(rScroll);

      const div = document.createElement('div');
      div.className = 'divider';
      pane.appendChild(left);
      pane.appendChild(div);
      pane.appendChild(right);
      requestAnimationFrame(() => makeDraggable(div, left, pane));

      if (sync) {
        syncScroll(lScroll, rScroll);
        syncScroll(rScroll, lScroll);
      }
      return pane;
    }

    // ── File list ──────────────────────────────────────────────────────

    async function loadList() {
      const res = await fetch('/list');
      const data = await res.json();
      files = data.files || [];
      renderList();
      document.getElementById('file-count').textContent = files.length + ' file' + (files.length !== 1 ? 's' : '');
      if (files.length > 0 && !activeFile) selectFile(files[0]);
    }

    let selectMode = false;

    function toggleSelectMode() {
      selectMode = !selectMode;
      document.body.classList.toggle('select-mode', selectMode);
      const btn = document.getElementById('select-btn');
      const delBtn = document.getElementById('delete-btn');
      btn.classList.toggle('active', selectMode);
      btn.textContent = selectMode ? 'Cancel' : 'Select';
      delBtn.style.display = selectMode ? '' : 'none';
      renderList();
    }

    async function deleteSelected() {
      const checks = document.querySelectorAll('.select-check:checked');
      const names = Array.from(checks).map(c => c.dataset.name);
      if (names.length === 0) return;
      if (!confirm(`PERMANENTLY DELETE ${names.length} file${names.length > 1 ? 's' : ''}?\n\nThis cannot be undone. Files will be deleted from disk, not moved to recycle bin.\n\n${names.join('\n')}`)) return;
      try {
        const res = await fetch('/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: names })
        });
        if (res.ok) {
          const data = await res.json();
          files = files.filter(f => !data.deleted.includes(f.name));
          if (activeFile && data.deleted.includes(activeFile.name)) activeFile = null;
          document.getElementById('file-count').textContent = files.length + ' file' + (files.length !== 1 ? 's' : '');
          renderList();
          if (files.length > 0 && !activeFile) selectFile(files[0]);
          else if (files.length === 0) {
            document.getElementById('preview-area').innerHTML = '<div id="empty-state"><div class="icon">&#10022;</div><div class="msg">Waiting for artifacts</div></div>';
          }
        }
      } catch(e) { alert('Delete failed: ' + e.message); }
    }

    function renderList(flashName) {
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      files.forEach(f => {
        const div = document.createElement('div');
        const isActive = activeFile && activeFile.name === f.name;
        div.className = 'file-item' + (isActive ? ' active' : '') + (f.name === flashName ? ' new-flash' : '');
        const b = badge(f.name);
        const check = `<input type="checkbox" class="select-check" data-name="${f.name}" onclick="event.stopPropagation()">`;
        div.innerHTML = `${check}<span class="badge badge-${b}">${b}</span>${f.name}<span class="ts">${timeAgo(f.mtime)}</span>`;
        div.onclick = () => { if (!selectMode) selectFile(f); };
        list.appendChild(div);
      });
    }

    // ── Preview renderer ───────────────────────────────────────────────

    function selectFile(f) {
      activeFile = f;
      cancelEdit();
      document.getElementById('current-file').textContent = f.name;
      document.getElementById('open-btn').href = '/files/' + encodeURIComponent(f.name);
      const editBtn = document.getElementById('edit-btn');
      editBtn.style.display = EDITABLE.includes(getExt(f.name)) ? 'inline-block' : 'none';
      const exportWrap = document.getElementById('export-dropdown-wrap');
      exportWrap.style.display = getExportOptions(getExt(f.name)).length > 0 ? 'inline-block' : 'none';
      document.getElementById('export-menu').style.display = 'none';

      const area = document.getElementById('preview-area');
      area.innerHTML = '';
      const e = getExt(f.name);
      const url = '/files/' + encodeURIComponent(f.name);

      // ── Visual: iframe ──────────────────────────────────────────────
      if (['html','htm','svg'].includes(e)) {
        const frame = document.createElement('iframe');
        frame.src = url;
        if (e !== 'svg') frame.sandbox = 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups';
        area.appendChild(frame);

      // ── Images ─────────────────────────────────────────────────────
      } else if (['png','jpg','jpeg','gif','webp'].includes(e)) {
        const wrap = document.createElement('div');
        wrap.id = 'img-preview';
        const img = document.createElement('img');
        img.src = url;
        wrap.appendChild(img);
        area.appendChild(wrap);

      // ── CSV: table ──────────────────────────────────────────────────
      } else if (e === 'csv') {
        fetch(url).then(r => r.text()).then(text => {
          const rows = text.trim().split('\n').map(line => {
            const cells = []; let cur = '', inQ = false;
            for (let i = 0; i < line.length; i++) {
              const c = line[i];
              if (c === '"') { inQ = !inQ; }
              else if (c === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
              else { cur += c; }
            }
            cells.push(cur.trim());
            return cells;
          });
          const wrap = document.createElement('div');
          wrap.id = 'csv-preview';
          if (rows.length > 1) wrap.innerHTML = `<div class="row-count">${rows.length - 1} row${rows.length - 1 !== 1 ? 's' : ''}</div>`;
          const table = document.createElement('table');
          rows.forEach((row, i) => {
            const tr = document.createElement('tr');
            row.forEach(cell => {
              const td = document.createElement(i === 0 ? 'th' : 'td');
              td.textContent = cell.replace(/^"|"$/g, '');
              tr.appendChild(td);
            });
            table.appendChild(tr);
          });
          wrap.appendChild(table);
          area.appendChild(wrap);
        });

      // ── Markdown: raw | rendered ────────────────────────────────────
      } else if (e === 'md') {
        fetch(url).then(r => r.text()).then(text => {
          const leftEl = makeCodeBlock(text, 'markdown');

          const rightEl = document.createElement('div');
          rightEl.className = 'md-rendered';
          rightEl.innerHTML = marked.parse(text);

          area.appendChild(makeSplitPane('Source', leftEl, 'Rendered', rightEl, true));
        });

      // ── JSON: raw | formatted ───────────────────────────────────────
      } else if (e === 'json') {
        fetch(url).then(r => r.text()).then(text => {
          const leftEl = makeCodeBlock(text, 'json');

          let rightEl;
          try {
            const pretty = JSON.stringify(JSON.parse(text), null, 2);
            rightEl = makeCodeBlock(pretty, 'json');
          } catch {
            rightEl = document.createElement('div');
            rightEl.style.cssText = 'padding:20px;color:#ff6b6b;font-size:0.8rem';
            rightEl.textContent = 'Invalid JSON';
          }

          area.appendChild(makeSplitPane('Raw', leftEl, 'Formatted', rightEl));
        });

      // ── Mermaid: source | rendered diagram ─────────────────────────
      } else if (['mermaid','mmd'].includes(e)) {
        fetch(url).then(r => r.text()).then(async text => {
          const leftEl = makeCodeBlock(text, 'plaintext');

          const rightEl = document.createElement('div');
          rightEl.style.cssText = 'padding:24px;display:flex;align-items:center;justify-content:center;min-height:100%;background:#1a1a24';
          try {
            const { svg } = await mermaid.render('mmd-' + Date.now(), text);
            rightEl.innerHTML = svg;
          } catch(err) {
            rightEl.style.cssText = 'padding:20px;color:#ff6b6b;font-size:0.8rem';
            rightEl.textContent = 'Mermaid error: ' + err.message;
          }

          area.appendChild(makeSplitPane('Source', leftEl, 'Diagram', rightEl, true));
        });

      // ── Code: syntax highlighted ────────────────────────────────────
      } else if (['py','js','ts','css','txt','xml','yaml','yml'].includes(e)) {
        const langMap = { py:'python', js:'javascript', ts:'typescript', css:'css', txt:'plaintext', xml:'xml', yaml:'yaml', yml:'yaml' };
        fetch(url).then(r => r.text()).then(text => {
          area.appendChild(makeCodeBlock(text, langMap[e] || 'plaintext'));
        });

      // ── Fallback: plain text ────────────────────────────────────────
      } else {
        fetch(url).then(r => r.text()).then(text => {
          const pre = document.createElement('div');
          pre.id = 'text-preview';
          pre.textContent = text;
          area.appendChild(pre);
        });
      }

      renderList();
    }

    // ── SSE ────────────────────────────────────────────────────────────

    function connect() {
      const es = new EventSource('/events');
      es.onopen = () => { dot.className = 'connected'; connStatus.textContent = 'Connected'; };
      es.onmessage = e => {
        const data = JSON.parse(e.data);
        const fname = data.file;
        dot.className = 'flash';
        setTimeout(() => dot.className = 'connected', 400);
        const existing = files.findIndex(f => f.name === fname);
        const entry = { name: fname, mtime: Date.now() };
        if (existing >= 0) files[existing] = entry;
        else files.unshift(entry);
        document.getElementById('file-count').textContent = files.length + ' file' + (files.length !== 1 ? 's' : '');
        renderList(fname);
        selectFile(entry);
      };
      es.onerror = () => {
        dot.className = '';
        connStatus.textContent = 'Server disconnected';
        es.close();
        setTimeout(() => {
          fetch('/list').then(r => { if (r.ok) connect(); else showServerDown(); })
                       .catch(() => showServerDown());
        }, 3000);
      };
    }

    function showServerDown() {
      dot.className = '';
      connStatus.textContent = 'Server is down';
      document.getElementById('preview-area').innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:40px;text-align:center">
          <div style="font-size:2.5rem;opacity:0.3">&#9888;</div>
          <div style="color:#ff6b6b;font-size:1rem;font-weight:600">Gallery server is not running</div>
          <div style="color:#888;font-size:0.8rem;line-height:1.8;max-width:400px">
            To restart, either:<br>
            &#8226; Double-click <strong>Start Gallery</strong> on your Desktop<br>
            &#8226; Or ask Claude Code: <code style="background:#1e1e2a;padding:2px 6px;border-radius:3px;color:#00ffcc">start the gallery</code>
          </div>
          <button onclick="location.reload()" style="margin-top:12px;background:#1e1e2a;border:1px solid #2a2a3a;color:#aaa;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:0.75rem">Retry</button>
        </div>`;
    }

    loadList().catch(() => showServerDown());
    connect();
  </script>
</body>
</html>
