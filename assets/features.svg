  <text x="200" y="225" fill="#888" font-size="11">.md</text>
  <text x="370" y="225" fill="#aaa" font-size="11">Split: source + rendered (scroll synced)</text>
  <circle cx="733" cy="222" r="5" fill="#00ffcc"/>
  <circle cx="823" cy="222" r="5" fill="#00ffcc"/>

