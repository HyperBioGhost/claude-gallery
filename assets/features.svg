  <rect x="30" y="166" width="840" height="36" fill="#12121a" rx="0"/>
  <rect x="50" y="175" width="30" height="16" fill="#4caf5022" rx="3"/>
  <text x="65" y="187" text-anchor="middle" fill="#4caf50" font-size="8" font-weight="700">IMG</text>
  <text x="88" y="189" fill="#ccc" font-size="12">Images</text>
  <text x="200" y="189" fill="#888" font-size="11">.png .jpg .gif .webp</text>
  <text x="370" y="189" fill="#aaa" font-size="11">Centered image view</text>
  <text x="730" y="189" fill="#555" font-size="11">—</text>
  <text x="810" y="189" fill="#555" font-size="11">—</text>

