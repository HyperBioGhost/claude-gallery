  <text x="88" y="477" fill="#ccc" font-size="12">CSS</text>
  <text x="200" y="477" fill="#888" font-size="11">.css</text>
  <text x="370" y="477" fill="#aaa" font-size="11">Syntax highlighted</text>
  <circle cx="733" cy="474" r="5" fill="#00ffcc"/>
  <text x="810" y="477" fill="#555" font-size="11">—</text>

  <!-- Row 12: XML -->
  <rect x="30" y="490" width="840" height="36" fill="#0f0f16" rx="0"/>
  <rect x="50" y="499" width="30" height="16" fill="#e34c2622" rx="3"/>
  <text x="65" y="511" text-anchor="middle" fill="#e8864a" font-size="8" font-weight="700">XML</text>
  <text x="88" y="513" fill="#ccc" font-size="12">XML</text>
  <text x="200" y="513" fill="#888" font-size="11">.xml</text>
  <text x="370" y="513" fill="#aaa" font-size="11">Syntax highlighted</text>
  <circle cx="733" cy="510" r="5" fill="#00ffcc"/>
  <text x="810" y="513" fill="#555" font-size="11">—</text>

