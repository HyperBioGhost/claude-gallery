  <rect x="30" y="382" width="840" height="36" fill="#12121a" rx="0"/>
  <rect x="50" y="391" width="24" height="16" fill="#f7df1e22" rx="3"/>
  <text x="62" y="403" text-anchor="middle" fill="#f7df1e" font-size="8" font-weight="700">JS</text>
  <text x="82" y="405" fill="#ccc" font-size="12">JavaScript</text>
  <text x="200" y="405" fill="#888" font-size="11">.js</text>
  <text x="370" y="405" fill="#aaa" font-size="11">Syntax highlighted</text>
  <circle cx="733" cy="402" r="5" fill="#00ffcc"/>
  <text x="810" y="405" fill="#555" font-size="11">—</text>

