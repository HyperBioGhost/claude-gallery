  <text x="88" y="297" fill="#ccc" font-size="12">Spreadsheet</text>
  <text x="200" y="297" fill="#888" font-size="11">.csv</text>
  <text x="370" y="297" fill="#aaa" font-size="11">Table with headers + row count</text>
  <circle cx="733" cy="294" r="5" fill="#00ffcc"/>
  <circle cx="823" cy="294" r="5" fill="#00ffcc"/>

  <!-- Row 7: Mermaid -->
  <rect x="30" y="310" width="840" height="36" fill="#12121a" rx="0"/>
  <rect x="50" y="319" width="34" height="16" fill="#ff338822" rx="3"/>
  <text x="67" y="331" text-anchor="middle" fill="#ff79a8" font-size="8" font-weight="700">MMD</text>
  <text x="92" y="333" fill="#ccc" font-size="12">Mermaid</text>
  <text x="200" y="333" fill="#888" font-size="11">.mermaid  .mmd</text>
  <text x="370" y="333" fill="#aaa" font-size="11">Split: source + rendered diagram</text>
  <circle cx="733" cy="330" r="5" fill="#00ffcc"/>
  <circle cx="823" cy="330" r="5" fill="#00ffcc"/>

