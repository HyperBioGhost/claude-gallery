<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f14"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#00ffcc" font-size="14" font-weight="600" letter-spacing="4" opacity="0.9">SUPPORTED FORMATS</text>

  <!-- Table header -->
  <rect x="30" y="58" width="840" height="32" fill="#16161f" rx="4"/>
  <text x="50" y="79" fill="#00ffcc" font-size="11" font-weight="600">FILE TYPE</text>
  <text x="200" y="79" fill="#00ffcc" font-size="11" font-weight="600">EXTENSION</text>
  <text x="370" y="79" fill="#00ffcc" font-size="11" font-weight="600">VIEW MODE</text>
  <text x="720" y="79" fill="#00ffcc" font-size="11" font-weight="600">EDIT</text>
  <text x="780" y="79" fill="#00ffcc" font-size="11" font-weight="600">LIVE PREVIEW</text>

  <!-- Row 1: webpage -->
  <rect x="30" y="94" width="840" height="36" fill="#12121a" rx="0"/>
  <rect x="50" y="103" width="36" height="16" fill="#e34c2622" rx="3"/>
  <text x="68" y="115" text-anchor="middle" fill="#e34c26" font-size="8" font-weight="700">HTML</text>
  <text x="95" y="117" fill="#ccc" font-size="12">Webpage</text>
  <text x="200" y="117" fill="#888" font-size="11">.html  .htm</text>
  <text x="370" y="117" fill="#aaa" font-size="11">Fully rendered webpage (iframe)</text>
  <text x="730" y="117" fill="#555" font-size="11">—</text>
  <text x="810" y="117" fill="#555" font-size="11">—</text>

  <!-- Row 2: SVG -->
  <rect x="30" y="130" width="840" height="36" fill="#0f0f16" rx="0"/>
  <rect x="50" y="139" width="30" height="16" fill="#ffb30022" rx="3"/>
  <text x="65" y="151" text-anchor="middle" fill="#ffb300" font-size="8" font-weight="700">SVG</text>
  <text x="88" y="153" fill="#ccc" font-size="12">Vector Image</text>
  <text x="200" y="153" fill="#888" font-size="11">.svg</text>
  <text x="370" y="153" fill="#aaa" font-size="11">Fully rendered image</text>
  <text x="730" y="153" fill="#555" font-size="11">—</text>
  <text x="810" y="153" fill="#555" font-size="11">—</text>

