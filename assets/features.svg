  <rect x="30" y="418" width="840" height="36" fill="#0f0f16" rx="0"/>
  <rect x="50" y="427" width="24" height="16" fill="#3178c622" rx="3"/>
  <text x="62" y="439" text-anchor="middle" fill="#5aa0e8" font-size="8" font-weight="700">TS</text>
  <text x="82" y="441" fill="#ccc" font-size="12">TypeScript</text>
  <text x="200" y="441" fill="#888" font-size="11">.ts</text>
  <text x="370" y="441" fill="#aaa" font-size="11">Syntax highlighted</text>
  <circle cx="733" cy="438" r="5" fill="#00ffcc"/>
