  <rect x="30" y="526" width="840" height="36" fill="#12121a" rx="0"/>
  <rect x="50" y="535" width="36" height="16" fill="#cb171e22" rx="3"/>
  <text x="68" y="547" text-anchor="middle" fill="#f06b6b" font-size="8" font-weight="700">YAML</text>
  <text x="95" y="549" fill="#ccc" font-size="12">YAML</text>
  <text x="200" y="549" fill="#888" font-size="11">.yaml  .yml</text>
  <text x="370" y="549" fill="#aaa" font-size="11">Syntax highlighted</text>
  <circle cx="733" cy="546" r="5" fill="#00ffcc"/>
  <text x="810" y="549" fill="#555" font-size="11">—</text>

  <!-- Row 14: TXT -->
  <rect x="30" y="562" width="840" height="36" fill="#0f0f16" rx="0"/>
  <rect x="50" y="571" width="30" height="16" fill="#9c27b022" rx="3"/>
  <text x="65" y="583" text-anchor="middle" fill="#ce93d8" font-size="8" font-weight="700">TXT</text>
  <text x="88" y="585" fill="#ccc" font-size="12">Plain Text</text>
  <text x="200" y="585" fill="#888" font-size="11">.txt</text>
  <text x="370" y="585" fill="#aaa" font-size="11">Monospace plain text</text>
  <circle cx="733" cy="582" r="5" fill="#00ffcc"/>
  <text x="810" y="585" fill="#555" font-size="11">—</text>

  <!-- Legend -->
  <circle cx="50" cy="610" r="4" fill="#00ffcc"/>
  <text x="60" y="614" fill="#666" font-size="9">Supported</text>
  <text x="120" y="614" fill="#555" font-size="9">—  Not applicable</text>

  <!-- Border glow -->
  <rect x="0" y="0" width="900" height="620" fill="none" stroke="#00ffcc" stroke-width="0.5" rx="12" opacity="0.2"/>
</svg>
